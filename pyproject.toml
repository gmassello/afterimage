[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
omit = ["*/tests/*", "*/conftest.py"]

[tool.mypy]
check_untyped_defs = true
exclude = ["/tests/"]
follow_imports = "silent"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
