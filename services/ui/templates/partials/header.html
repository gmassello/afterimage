<header class='top'>
<div class='row'><a class='brand' href='/'>afterimage</a><nav class='top' aria-label='{{ t.views_label }}'>
{%- for link in nav -%}
{%- if link.href %}<a href='{{ link.href }}'{% if link.here %} class='here' aria-current='page'{% endif %}>{{ link.label }}</a>{% else %}<span class='here'>{{ link.label }}</span>{% endif -%}
{%- endfor -%}
</nav></div>
<div class='row'><span class='runid'>{{ meta }}</span><a class='repo' href='https://github.com/gmassello/afterimage' aria-label='{{ t.repo_label }}'><svg viewBox='0 0 16 16' width='20' height='20' aria-hidden='true' focusable='false'><path fill='currentColor' d='M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z'/></svg></a><nav class='langs' aria-label='{{ t.lang_label }}'>
{%- for code in langs %}<a href='?lang={{ code }}'{% if code == lang %} class='here' aria-current='true'{% endif %} hreflang='{{ code }}'>{{ code|upper }}</a>{% endfor -%}
</nav><nav class='regs' aria-label='{{ t.register_label }}'>
{%- for code in registers %}<a href='?register={{ code }}'{% if code == register %} class='here' aria-current='true'{% endif %}>{{ t[code ~ '_name'] }}</a>{% endfor -%}
</nav><button class='toggle' id='theme' type='button'><span aria-hidden='true'>&#9680;</span><span id='theme-label'>{{ t.theme_dark }}</span></button></div>
</header>
