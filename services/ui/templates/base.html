<!doctype html><html lang='en' data-theme='light'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>afterimage &mdash; {{ title }}</title>
<meta name='description' content='A visual inspection agent that remembers: every branch it takes is decided in code, and the trace carries the number that decided it.'>
<meta property='og:title' content='afterimage &mdash; a visual inspection agent that remembers'>
<meta property='og:description' content='Upload a capture, watch the agent gate it, anchor it to memory and escalate what a human has to see. Every decision carries the number that triggered it.'>
<meta property='og:image' content='https://raw.githubusercontent.com/gmassello/afterimage/main/docs/img/trace.png'>
<meta property='og:type' content='website'>
<meta name='twitter:card' content='summary_large_image'>
<meta name='theme-color' content='#e4e7f5' media='(prefers-color-scheme: light)'>
<meta name='theme-color' content='#161826' media='(prefers-color-scheme: dark)'>
<link rel='icon' href='{{ icon_url }}' type='image/svg+xml'>
<link rel='preload' href='{{ font_url }}' as='font' type='font/woff2' crossorigin>
<style>
@font-face { font-family: 'Inter'; src: url('{{ font_url }}') format('woff2');
             font-weight: 100 900; font-style: normal; font-display: swap; }
</style>
<link rel='stylesheet' href='{{ css_url }}'>
<script>
try {
  const saved = localStorage.getItem('afterimage-theme');
  if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.dataset.theme = 'dark';
  }
} catch (e) {}
</script>
</head><body>
<div class='page'
  {%- if run_state %} data-run-state='{{ run_state }}'{% endif %}
  {%- if execute_url %} data-execute-url='{{ execute_url }}'{% endif %}>
<div class='{{ "wrap narrow" if narrow else "wrap" }}'>
{% include 'partials/header.html' %}
{% if says %}<p class='runstate'><span class='says' role='status' aria-live='polite'>{{ says }}</span>{% if run_state %}<span class='clock' aria-hidden='true'></span>{% endif %}</p>{% endif %}
<main>{% block body %}{% endblock %}</main>
{% block tail %}{% endblock %}
</div></div>
<script src='{{ js_url }}'></script>
</body></html>
