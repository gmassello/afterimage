services:
  localstack:
    image: localstack/localstack:4.9.2
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 25
      start_period: 5s

  app:
    build: .
    platform: linux/arm64
    volumes:
      - ./eval:/app/eval
      - ./docs:/app/docs:ro
      - ./README.md:/app/README.md:ro
      - ./NOTICE:/app/NOTICE:ro
      - ./video/script.tsv:/app/video/script.tsv:ro
    command: uvicorn services.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - GOOGLE_API_KEY
      - AFTERIMAGE_GEMINI_MODEL
