name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Cached ALIKED + LightGlue weights
        uses: actions/cache@v4
        with:
          path: models
          key: weights-${{ hashFiles('services/perception/weights.py') }}
      - name: ALIKED + LightGlue weights
        run: make weights
      - name: Build the arm64 OpenCV 5 image
        run: make build
      - name: The runtime is OpenCV 5 on arm64
        run: make verify-runtime
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Suite and coverage floor
        run: make test

  eval:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Cached ALIKED + LightGlue weights
        uses: actions/cache@v4
        with:
          path: models
          key: weights-${{ hashFiles('services/perception/weights.py') }}
      - name: Score the evaluation dataset
        run: make eval ARGS="--out eval/results/ci"
      - name: The published numbers match a fresh run
        run: python3 eval/compare_results.py eval/results/latest eval/results/ci
