name: Latency

on:
  workflow_dispatch:
    inputs:
      since:
        description: ISO-8601 start of the window, e.g. the last deploy
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  inspections:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/checkout@v4

      - name: Latency and cost
        env:
          SINCE: ${{ inputs.since }}
        run: infra/latency.sh "$SINCE"
