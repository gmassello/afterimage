name: Latency

on:
  workflow_dispatch:
    inputs:
      since:
        description: ISO-8601 start of the window, e.g. the last deploy
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  inspections:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Inspection latency
        env:
          SINCE: ${{ inputs.since }}
        run: |
          ID=$(aws logs start-query --log-group-name /aws/lambda/afterimage-api \
            --start-time "$(date -d "$SINCE" +%s)" --end-time "$(date +%s)" \
            --query-string 'filter @type="REPORT" and @duration > 10000
              | stats count(), pct(@duration,50), min(@duration), max(@duration), pct(@billedDuration,50), max(@maxMemoryUsed)/1048576' \
            --query queryId --output text)
          until [ "$(aws logs get-query-results --query-id "$ID" --query status --output text)" = Complete ]; do sleep 2; done
          aws logs get-query-results --query-id "$ID" --query results --output json
